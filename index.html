<!DOCTYPE html>
<html>
<head>
    <title>Emma | Future Software Developer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            max-width: 700px;
            margin: auto;
            padding: 40px;
            background: #1f2937;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 45px;
            color: #818cf8;
        }

        h2 {
            color: #a5b4fc;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        li {
            list-style: none;
            margin: 12px;
            font-size: 18px;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        h1 {
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>👋 Hi, I'm Emma</h1>

        <p>
            I'm learning web development and artificial intelligence.
        </p>

        <h2>🚀 My Goals</h2>

        <ul>
            <li>💻 Become a software developer</li>
            <li>🌐 Build professional websites</li>
            <li>🤖 Build AI applications</li>
            <li>🚀 Start my own software business</li>
        </ul>

        <button onclick="alert('Welcome to Emma\\'s website! 🎉')">
            Click Me
        </button>

    </div>

</body>
</html>
