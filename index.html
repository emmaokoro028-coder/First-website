<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emma | Future Software Developer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding: 40px 20px;
            transition: 0.4s;
        }

        .card {
            max-width: 800px;
            margin: auto;
            padding: 50px 30px;
            background: #1f2937;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 45px;
            color: #818cf8;
        }

        h2 {
            color: #a5b4fc;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        .goals {
            list-style: none;
            padding: 0;
            font-size: 20px;
            line-height: 2;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* LIGHT MODE */

        body.light {
            background: #f3f4f6;
            color: #111827;
        }

        body.light .card {
            background: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        body.light h1 {
            color: #4f46e5;
        }

        body.light h2 {
            color: #6366f1;
        }

        /* DARK MODE BUTTON */

        .theme-button {
            position: fixed;
            top: 20px;
            right: 20px;
            margin: 0;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            padding: 0;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <!-- Dark Mode Button -->
    <button class="theme-button" onclick="toggleTheme()">🌙</button>

    <div class="card">

        <h1>👋 Hi, I'm Emma</h1>
        <img src="IMG_4811.jpeg" alt="Emma's photo" class="profile-photo"> 
        <p>
            I'm learning web development and artificial intelligence.
        </p>

        <h2>🚀 My Goals</h2>

        <ul class="goals">
            <li>💻 Become a software developer</li>
            <li>🌐 Build professional websites</li>
            <li>🤖 Build AI applications</li>
            <li>🚀 Start my own software business</li>
        </ul>

        <button onclick="sayHello()">Click Me</button>

    </div>

    <script>

        function toggleTheme() {
            document.body.classList.toggle("light");

            const button = document.querySelector(".theme-button");

            if (document.body.classList.contains("light")) {
                button.textContent = "☀️";
            } else {
                button.textContent = "🌙";
            }
        }

        function sayHello() {
            alert("Welcome to Emma's portfolio! 🚀");
        }

    </script>

</body>
</html>
